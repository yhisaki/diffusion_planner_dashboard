repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Uses ML-Planner's .venv, since this repository is installed into it.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: env PYRIGHT_PYTHON_GLOBAL_NODE=off ../../.venv/bin/pyright
        language: system
        types: [python]
        pass_filenames: false
