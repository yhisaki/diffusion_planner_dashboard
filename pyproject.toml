[project]
name = "diffusion-planner-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for diffusion planner frame data"
requires-python = ">=3.10"
dependencies = [
    "diffusion-planner",
    "h5py>=3.16.0",
    "hdf5plugin>=7.0.0",
    "numpy>=2.2.6",
    "pyarrow>=25.0.0",
    "streamlit>=1.48.0",
]

[project.scripts]
diffusion-planner-dashboard = "diffusion_planner_dashboard.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["diffusion_planner", "diffusion_planner_dashboard"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
# ML-Planner's .venv; this repository is cloned into ML-Planner/packages/.
venvPath = "../.."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
